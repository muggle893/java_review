server:
  port: 10010
spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: 8.160.162.76:8848
    gateway:
      routes: #网关路由配置
        - id: user-service #路由ID, 自定义, 唯一即可
          uri: lb://user-service #目标服务地址
          predicates: #路由条件
          - Path=/user/**
        - id: blog-service
          uri: lb://blog-service
          predicates:
          - Path=/blog/**