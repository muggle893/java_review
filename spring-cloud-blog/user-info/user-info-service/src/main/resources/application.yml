server:
  port: 8080

spring:
  mail:
    # 指定邮件服务器地址
    host: smtp.qq.com
    # 登录账户
    username: 1786772884@qq.com
    # 登录密码
    password:
    # 默认编码
    default-encoding: UTF-8
    # 使用的协议
    protocol: smtps
    properties:
      personal: "晓峰博客系统"

  rabbitmq:
    host: ${rabbitmq.host}
    port: ${rabbitmq.port}
    username:
    password:
    virtual-host: blog-dev
    listener:
      simple:
        acknowledge-mode: manual

  data:
    redis:
      host: ${redis.host}
      port: ${redis.port}
      timeout: 60s
      password:
      lettuce:
       pool:
        max-active: 8 #允许最⼤连接数
        max-idle: 8 #最⼤空闲连接数, 默认8
        min-idle: 0 #最⼩空闲连接数
        max-wait: 5s #请求获取连接等待时间

  application:
    name: user-service


  datasource:
    url: jdbc:mysql://127.0.0.1:3306/spring_cloud_user?characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${mysql.username}
    password: ${mysql.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  cloud:
    nacos:
      discovery:
        server-addr: ${nacos.address}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


logging:
  file:
    name: user-service.log

