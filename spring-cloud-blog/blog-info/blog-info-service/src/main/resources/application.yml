server:
  port: 9090

spring:
  application:
    name: blog-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/spring_cloud_blog?characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${mysql.username}
    password: ${mysql.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: ${nacos.address}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  file:
    name: blog-service.log
---
# 开发环境
spring:
  config:
    activate:
      on-profile: dev
nacos:
  address: 8.160.162.76:8848

mysql:
  username: root
  password: 123456

