spring:
  ai:
    model:
      embedding: none
    openai:
      api-key: $APINEBULA_API_KEY$
      base-url: https://img-api.apinebula.ai
      image:
        base-url: https://img-api.apinebula.ai
        options:
          model: gpt-image-2
          n: 1
          size: 1024x1024
          quality: medium
          response-format: url

logging:
  level:
    org.springframework.ai.chat.client.advisor: debug