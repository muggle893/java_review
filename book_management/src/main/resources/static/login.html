<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/login.css">
    <script type="text/javascript" src="js/jquery.min.js"></script>
</head>

<body>
    <div class="container-login">
        <div class="container-pic">
            <img src="pic/computer.png" width="350px">
        </div>
        <div class="login-dialog">
            <h3>登陆</h3>
            <div class="row">
                <span>用户名</span>
                <input type="text" name="userName" id="userName" class="form-control">
            </div>
            <div class="row">
                <span>密码</span>
                <input type="password" name="password" id="password" class="form-control">
            </div>
            <div class="row">
                <button type="button" class="btn btn-info btn-lg" onclick="login()">登录</button>
            </div>
        </div>
    </div>
    <script src="js/jquery.min.js"></script>
    <script>
        function login() {
            // 获取输入框内容
            let password = $("#password").val();
            let username = $("#userName").val().trim();

            // 校验参数
            if (username.length === 0) {
                alert("用户名不能为空！");
                return;
            }

            if (password.length === 0) {
                alert("密码不能为空！");
                return;
            }

            // 请求期间禁用登录按钮
            var button = $(".login-dialog button");
            button.prop("disabled", true).text("登录中...");

            // 3. 向后端发送请求
            $.ajax({
                url: "/user/login",
                type: "POST",

                // 参数名要对应后端的 username、password
                data: {
                    username: username,
                    password: password
                },

                // 兼容后端 return null 时的空响应
                dataType: "text",
                timeout: 10000,

                success: function (response) {
                    // 后端没有查到用户，可能返回空响应
                    if (!response || !response.trim()) {
                        alert("用户名或密码错误");
                        return;
                    }

                    // 将 JSON 字符串转换成 JavaScript 对象
                    var user;
                    try {
                        user = JSON.parse(response);
                    } catch (e) {
                        alert("服务器返回的数据格式异常");
                        return;
                    }

                    // 后端返回了有效的用户对象
                    if (user && user.id != null) {
                        window.location.href = "book_list.html";
                    } else {
                        alert("用户名或密码错误");
                    }
                },

                // 网络错误、404、500 等情况
                error: function (xhr, textStatus) {
                    if (textStatus === "timeout") {
                        alert("请求超时，请稍后重试");
                    } else {
                        alert("登录请求失败，请检查网络或后端服务");
                    }
                },

                // 请求结束后恢复按钮
                complete: function () {
                    button.prop("disabled", false).text("登录");
                }
            });
        }
    </script>
</body>

</html>
